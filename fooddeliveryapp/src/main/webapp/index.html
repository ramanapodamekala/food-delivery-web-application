<!DOCTYPE html>
<html>
<head>
<title>Food Delivery</title>

<style>
    body {
        font-family: Arial;
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        text-align: center;
        margin-top: 100px;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 300px;
        margin: auto;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    }

    h1 {
        color: #ff4b2b;
    }

    input {
        width: 90%;
        padding: 8px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        background-color: #ff4b2b;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #ff416c;
    }
</style>

</head>

<body>

<div class="container">
    <h1>Food Delivery App</h1>

    <form action="/fooddeliveryapp/OrderServlet" method="get">
        <input type="text" name="item" placeholder="Enter food item"><br>
        <input type="text" name="qty" placeholder="Enter quantity"><br>
        <button type="submit">Order</button>
    </form>
</div>

</body>
</html>
