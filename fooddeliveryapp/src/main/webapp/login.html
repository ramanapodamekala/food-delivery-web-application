<!DOCTYPE html>
<html>
<head>
    <title>RCB Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;

            /* 🔥 RCB dark gradient */
            background: linear-gradient(to right, #000000, #1a0000, #330000);
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.5);
        }

        h2 {
            color: #ff1a1a;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        button {
            background: #ff1a1a;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #cc0000;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        /* 🔥 Optional Virat background image */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/8Km9tLL.png') no-repeat center;
            background-size: cover;
            opacity: 0.08; /* keep it subtle */
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>RCB Login 🔥</h2>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("error")) {
            document.write("<p class='error'>Invalid Login ❌</p>");
        }
    </script>

    <form action="login" method="get">
        <input type="text" name="username" placeholder="Username"><br>
        <input type="password" name="password" placeholder="Password"><br>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
