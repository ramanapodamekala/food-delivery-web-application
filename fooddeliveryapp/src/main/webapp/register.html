<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            background: linear-gradient(to right, black, darkred);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box {
            background: black;
            padding: 30px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        input {
            margin: 10px;
            padding: 10px;
            width: 200px;
        }

        button {
            background: red;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Create Account 🔥</h2>

    <form action="register" method="post">
        <input type="text" name="username" placeholder="Username"><br>
        <input type="password" name="password" placeholder="Password"><br>
        <button type="submit">Register</button>
    </form>

    <br>
    <a href="login.html" style="color:red;">Already have account? Login</a>
</div>

</body>
</html>
